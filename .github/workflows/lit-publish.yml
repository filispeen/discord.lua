name: Publish to Lit

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install lit
        run: |
          curl -L https://github.com/luvit/lit/raw/master/get-lit.sh | sh
          echo "$PWD" >> $GITHUB_PATH

      - name: Install libsodium (Windows dlls)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          curl -s https://api.github.com/repos/jedisct1/libsodium/releases/latest | jq -r '.assets[] | select(.name | test("msvc.zip$")) | .browser_download_url' | xargs -I{} curl -L -o libsodium-latest-msvc.zip {}
          unzip libsodium-latest-msvc.zip 'libsodium/*/Release/v143/dynamic/*.dll' -d ./
          mkdir -p ./lib/dlls
          for arch in x64 Win32 ARM64; do
            mv "./libsodium/$arch/Release/v143/dynamic/libsodium.dll" "./lib/dlls/libsodium-$arch.dll"
            echo "Copied libsodium.dll for $arch"
          done

      - name: Build libopus (Windows dlls)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git opus-src
          mkdir -p ./lib/dlls

          declare -A targets=( [x64]=x86_64-w64-mingw32 [Win32]=i686-w64-mingw32 )
          for arch in "${!targets[@]}"; do
            host="${targets[$arch]}"
            build_dir="opus-build-$arch"
            cmake -S opus-src -B "$build_dir" \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_C_COMPILER="${host}-gcc" \
              -DCMAKE_RC_COMPILER="${host}-windres" \
              -DOPUS_BUILD_SHARED_LIBRARY=ON \
              -DOPUS_BUILD_PROGRAMS=OFF \
              -DOPUS_BUILD_TESTING=OFF
            cmake --build "$build_dir" --config Release
            find "$build_dir" -iname "opus.dll" -exec cp {} "./lib/dlls/opus-$arch.dll" \;
            echo "Built opus.dll for $arch"
          done

      - name: Authenticate with lit
        run: ./lit auth ${{ secrets.LIT_GITHUB_USERNAME }} "${{ secrets.LIT_GITHUB_USERNAME }}" ""

      - name: Go online
        run: ./lit up

      - name: Publish package
        run: ./lit publish .

      - name: Update lint badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID}}
          filename: lit-badge.json
          label: Publish to LIT
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || 'red' }}