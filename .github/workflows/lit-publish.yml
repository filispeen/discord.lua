name: Publish to Lit

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  FFMPEG_TAG: n9.0.1
  OPUS_TAG: v1.5.2
  LIBSODIUM_TAG: 1.0.22-RELEASE

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install lit
        run: |
          curl -L https://github.com/luvit/lit/raw/master/get-lit.sh | sh
          echo "$PWD" >> $GITHUB_PATH

      - name: Restore native bundle cache
        id: native-bundle-cache
        uses: actions/cache@v4
        with:
          path: |
            lib/bundle/linux-x64/bin
            lib/bundle/linux-x64/lib
            lib/bundle/windows-x64/bin
            lib/bundle/windows-x64/dll
          key: native-bundle-${{ runner.os }}-ffmpeg-${{ env.FFMPEG_TAG }}-opus-${{ env.OPUS_TAG }}-libsodium-${{ env.LIBSODIUM_TAG }}-${{ hashFiles('scripts/build-minimal-ffmpeg.sh') }}

      - name: Build native bundle
        if: steps.native-bundle-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-minimal-ffmpeg.sh

      - name: Write a version into package.lua
        run: |
          REF=${{ github.event.workflow_run.head_branch }}
          version=${REF#v}
          sed -i "s/version = \"REPLACE_ME\"/version = \"${version}\"/" package.lua

      - name: Authenticate with lit
        run: ./lit auth ${{ secrets.LIT_GITHUB_USERNAME }} "${{ secrets.LIT_GITHUB_USERNAME }}" ""

      - name: Go online
        run: ./lit up

      - name: Publish package
        run: ./lit publish .

      - name: Update lint badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID}}
          filename: lit-badge.json
          label: Publish to LIT
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || 'red' }}
