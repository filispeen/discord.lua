name: Publish to Lit

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install lit
        run: |
          curl -L https://github.com/luvit/lit/raw/master/get-lit.sh | sh
          echo "$PWD" >> $GITHUB_PATH

      - name: Restore native bundle cache
        id: native-bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/bundle/linux-x64/bin
            lib/bundle/linux-x64/lib
            lib/bundle/windows-x64/bin
            lib/bundle/windows-x64/dll
          key: native-bundle-${{ runner.os }}-${{ hashFiles('scripts/build-minimal-ffmpeg.sh') }}

      - name: Build native bundle
        if: steps.native-bundle-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-minimal-ffmpeg.sh

      - name: Restore library cache
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: lit-deps-${{ runner.os }}-${{ hashFiles('package.lua') }}

      - name: Write a version into package.lua
        run: |
          REF=${{ github.event.workflow_run.head_branch }}
          version=${REF#v}
          sed -i "s/version = \"REPLACE_ME\"/version = \"${version}\"/" package.lua

      - name: Authenticate with lit
        run: ./lit auth ${{ secrets.LIT_GITHUB_USERNAME }} "${{ secrets.LIT_GITHUB_USERNAME }}" ""

      - name: Go online
        run: ./lit up

      - name: Publish package
        run: ./lit publish .

      - name: Upload native bundles to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tar -C lib/bundle -cJf discord-bundle-linux-x64.tar.xz linux-x64
          (cd lib/bundle && zip -qr "$GITHUB_WORKSPACE/discord-bundle-windows-x64.zip" windows-x64)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" discord-bundle-linux-x64.tar.xz discord-bundle-windows-x64.zip --clobber
          else
            gh release create "$TAG" discord-bundle-linux-x64.tar.xz discord-bundle-windows-x64.zip --generate-notes
          fi

      - name: Update lint badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID}}
          filename: lit-badge.json
          label: Publish to LIT
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || 'red' }}
