name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint with luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua/LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks libsodium-dev
      - name: Install luacheck
        run: sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck --no-unused-args .

      - name: Update lint badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID}}
          filename: lint-badge.json
          label: Lint with luacheck
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || 'red' }}

  test:
    name: Run busted tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore native bundle cache
        id: native-bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/bundle/linux-x64/bin
            lib/bundle/linux-x64/lib
            lib/bundle/windows-x64/bin
            lib/bundle/windows-x64/dll
          key: native-bundle-${{ runner.os }}-${{ hashFiles('scripts/build-minimal-ffmpeg.sh') }}

      - name: Build native bundle
        if: steps.native-bundle-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-minimal-ffmpeg.sh

      - name: Install Lua/LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks libsodium-dev
      - name: Install lit/luvi/luvit
        run: |
          curl -L https://github.com/luvit/lit/raw/master/get-lit.sh | sh
          sudo install lit luvi luvit /usr/local/bin/
      - name: Install luvit dependencies
        run: lit install luvit/coro-http luvit/coro-websocket luvit/secure-socket luvit/json

      - name: Validate native bundle installer
        env:
          BUNDLE_INSTALL_DRY_RUN: 1
        run: luvit install.lua

      - name: Install busted
        run: sudo luarocks install busted

      - name: Run busted tests
        run: |
          eval "$(luarocks path --lua-version=5.1)"
          LUA_PATH="./spec/?.lua;./deps/?.lua;./deps/?/init.lua;${LUA_PATH}" \
          exec luvit spec/busted_runner.lua -p _spec.lua -r spec

      - name: Update test badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID}}
          filename: test-badge.json
          label: Run busted tests
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || 'red' }}

  rockspec:
    name: Validate rockspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua/LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks libsodium-dev
      - name: Validate rockspec
        run: luarocks lint discord-lua-scm-0.rockspec

      - name: Update rockspec badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID}}
          filename: rockspec-badge.json
          label: Validate rockspec
          message: ${{ job.status }}
          color: ${{ job.status == 'success' && 'green' || 'red' }}

  native-bundle-cache:
    name: Cache native bundle
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore native bundle cache
        id: native-bundle-cache
        uses: actions/cache@v4
        with:
          path: |
            lib/bundle/linux-x64/bin
            lib/bundle/linux-x64/lib
            lib/bundle/windows-x64/bin
            lib/bundle/windows-x64/dll
          key: native-bundle-${{ runner.os }}-${{ hashFiles('scripts/build-minimal-ffmpeg.sh') }}

      - name: Build native bundle
        if: steps.native-bundle-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-minimal-ffmpeg.sh

      - name: Restore library cache
        id: library-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: lit-deps-${{ runner.os }}-${{ hashFiles('package.lua') }}

      - name: Install lit
        if: steps.library-cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/luvit/lit/raw/master/get-lit.sh | sh
          echo "$PWD" >> $GITHUB_PATH

      - name: Install libraries
        if: steps.library-cache.outputs.cache-hit != 'true'
        run: |
          ./lit up
          ./lit install

  discord-notify:
    name: Discord nitification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send notification
        uses: filispeen/discord-notifier@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}